<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceStream M3U Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo para enfocar elementos con el mando de la Android TV */
        *:focus {
            outline: 3px solid #3b82f6 !important;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-xl font-bold flex items-center gap-2">📺 AceStream M3U</h1>
        <div class="flex gap-2 items-center flex-wrap">
            <input type="text" id="m3uUrlInput" placeholder="URL de la lista M3U..." class="bg-slate-700 px-3 py-2 rounded text-sm w-64 focus:outline-none">
            <button onclick="loadFromURL()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold transition">Cargar URL</button>
            <label class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm font-semibold cursor-pointer transition">
                Subir M3U <input type="file" id="m3uFileInput" accept=".m3u,.m3u8" class="hidden" onchange="loadFromFile(event)">
            </label>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Sidebar Categorías -->
        <aside class="md:col-span-1 bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 h-fit">
            <h2 class="text-lg font-semibold mb-3">Categorías</h2>
            <div id="categoriesList" class="flex flex-col gap-1 max-h-[60vh] overflow-y-auto pr-1">
                <button onclick="filterCategory('ALL')" class="text-left px-3 py-2 rounded bg-blue-600 font-medium transition">Todas</button>
            </div>
        </aside>

        <!-- Canal List / Grid -->
        <section class="md:col-span-3 flex flex-col gap-4">
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded w-full focus:outline-none">
            </div>
            <div id="channelsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-400 col-span-full text-center py-12">Carga una lista M3U para empezar a ver los canales.</p>
            </div>
        </section>
    </main>

    <script>
        let allChannels = [];
        let currentCategory = 'ALL';

        // Cargar última lista guardada al iniciar
        window.onload = () => {
            const saved = localStorage.getItem('saved_m3u_channels');
            if (saved) {
                allChannels = JSON.parse(saved);
                renderCategories();
                renderChannels(allChannels);
            }
        };

        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    // Extraer logo
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch) currentChannel.logo = logoMatch[1];

                    // Extraer categoría
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch) currentChannel.group = groupMatch[1];
                    else currentChannel.group = "General";

                    // Nombre del canal
                    const nameParts = line.split(',');
                    currentChannel.name = nameParts[nameParts.length - 1].trim();
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    // Detectar ID de Acestream (sea formato acestream:// o magnet o hash)
                    if (currentChannel.url.includes('acestream://') || currentChannel.url.length === 40) {
                        channels.push(currentChannel);
                    }
                }
            }
            return channels;
        }

        async function loadFromURL() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return alert('Introduce una URL válida');
            try {
                // Si hay problemas de CORS con URLs externas, se puede usar un proxy o fetch directo
                const response = await fetch(url);
                const text = await response.text();
                processM3UText(text);
            } catch (e) {
                alert('Error al cargar la URL (comprueba que permita CORS o descarga el archivo).');
            }
        }

        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => processM3UText(e.target.result);
            reader.readAsText(file);
        }

        function processM3UText(text) {
            allChannels = parseM3U(text);
            localStorage.setItem('saved_m3u_channels', JSON.stringify(allChannels));
            renderCategories();
            renderChannels(allChannels);
        }

        function renderCategories() {
            const categories = ['ALL', ...new Set(allChannels.map(c => c.group))];
            const container = document.getElementById('categoriesList');
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="text-left px-3 py-2 rounded hover:bg-slate-700 transition ${cat === currentCategory ? 'bg-blue-600 font-medium' : ''}">
                    ${cat === 'ALL' ? 'Todas' : cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterChannels();
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(c => {
                const matchesCat = currentCategory === 'ALL' || c.group === currentCategory;
                const matchesQuery = c.name.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });
            renderChannels(filtered);
        }

        function renderChannels(channels) {
            const container = document.getElementById('channelsContainer');
            if (channels.length === 0) {
                container.innerHTML = `<p class="text-slate-400 col-span-full text-center py-12">No se encontraron canales.</p>`;
                return;
            }
            container.innerHTML = channels.map(c => {
                let acestreamId = c.url.replace('acestream://', '').trim();
                return `
                    <div onclick="openAceStream('${acestreamId}')" tabindex="0" class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:border-blue-500 transition focus:border-blue-500">
                        ${c.logo ? `<img src="${c.logo}" class="w-12 h-12 object-contain bg-slate-900 rounded p-1" onerror="this.style.display='none'">` : `<div class="w-12 h-12 bg-slate-700 rounded flex items-center justify-center text-xl">📺</div>`}
                        <div class="overflow-hidden">
                            <h3 class="font-semibold truncate">${c.name}</h3>
                            <p class="text-xs text-slate-400 truncate">${c.group}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAceStream(id) {
            // Esquema URI compatible con Ace Stream Engine en Android / Android TV
            window.location.href = `acestream://` + id;
        }
    </script>
</body>
</html>
